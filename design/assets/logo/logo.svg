<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Race jeunes</title>
  <defs>
    <clipPath id="ball"><circle cx="300" cy="196" r="104"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#14293E"/>
  <!-- lignes de court en perspective -->
  <g fill="none" stroke="#FDC2B2" stroke-width="6" stroke-linecap="round" opacity=".35">
    <path d="M96 440 L176 300 H336 L416 440"/>
    <path d="M136 370 H376"/>
    <path d="M256 300 V370"/>
  </g>
  <!-- podium / progression de la Race -->
  <g fill="#FDC2B2">
    <rect x="92"  y="356" width="72" height="84" rx="14"/>
    <rect x="186" y="304" width="72" height="136" rx="14"/>
    <rect x="280" y="336" width="72" height="104" rx="14"/>
  </g>
  <!-- balle -->
  <circle cx="300" cy="196" r="104" fill="#FF7F5C"/>
  <g clip-path="url(#ball)" fill="none" stroke="#14293E" stroke-width="12" stroke-linecap="round">
    <path d="M206 128 C 262 160, 262 232, 206 264"/>
    <path d="M394 128 C 338 160, 338 232, 394 264"/>
  </g>
  <!-- trajectoire montante -->
  <path d="M84 300 C 140 250, 176 236, 214 214" fill="none" stroke="#F6F6F6" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 26"/>
  <path d="M398 404 l44 -44 m0 0 h-34 m34 0 v34" fill="none" stroke="#F6F6F6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
