<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Composition de la vidéo de présentation</title>
    <style>
      @font-face {
        font-family: Poppins;
        font-weight: 400;
        src: url("../../public/fonts/poppins-latin-400.woff2") format("woff2");
      }
      @font-face {
        font-family: Poppins;
        font-weight: 500;
        src: url("../../public/fonts/poppins-latin-500.woff2") format("woff2");
      }
      @font-face {
        font-family: Poppins;
        font-weight: 600;
        src: url("../../public/fonts/poppins-latin-600.woff2") format("woff2");
      }
      @font-face {
        font-family: Poppins;
        font-weight: 700;
        src: url("../../public/fonts/poppins-latin-700.woff2") format("woff2");
      }
      :root {
        --navy: #1f2b42;
        --deep: #161f31;
        --coral: #e28c57;
        --sand: #ebb08c;
        --ink: #f6f6f6;
        --muted: #b9c2d3;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
        font-family: Poppins, sans-serif;
        color: var(--ink);
      }
      .stage {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(1100px 800px at 78% 50%, rgba(226, 140, 87, 0.16), transparent 60%),
          linear-gradient(var(--navy), var(--navy));
      }
      .grid {
        position: absolute;
        inset: 0;
        opacity: 0.09;
        background-image:
          linear-gradient(var(--sand) 1px, transparent 1px),
          linear-gradient(90deg, var(--sand) 1px, transparent 1px);
        background-size: 80px 80px;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 10px;
        background: var(--coral);
      }
      .progress {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 10px;
        background: var(--sand);
      }

      .brand {
        position: absolute;
        left: 150px;
        top: 96px;
        display: flex;
        align-items: center;
        gap: 20px;
        font-weight: 600;
        font-size: 28px;
        letter-spacing: 0.02em;
      }
      .brand img {
        width: 64px;
        height: 64px;
      }

      .caption {
        position: absolute;
        left: 150px;
        top: 300px;
        width: 860px;
      }
      .kicker {
        display: inline-block;
        font-weight: 600;
        font-size: 24px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--deep);
        background: var(--sand);
        padding: 6px 18px;
        border-radius: 999px;
      }
      .title {
        margin-top: 30px;
        font-weight: 700;
        font-size: 74px;
        line-height: 1.08;
        letter-spacing: -0.01em;
      }
      .body {
        margin-top: 30px;
        font-size: 34px;
        line-height: 1.45;
        color: var(--muted);
        max-width: 800px;
      }
      .chapters {
        position: absolute;
        left: 150px;
        bottom: 96px;
        display: flex;
        gap: 12px;
      }
      .chapters span {
        width: 46px;
        height: 8px;
        border-radius: 4px;
        background: rgba(235, 176, 140, 0.25);
      }
      .chapters span.on {
        background: var(--coral);
      }

      .phone {
        position: absolute;
        left: 1180px;
        top: 70px;
        width: 470px;
        height: 940px;
        border-radius: 64px;
        background: #0b111d;
        padding: 14px;
        box-shadow:
          0 40px 120px rgba(0, 0, 0, 0.55),
          inset 0 0 0 2px rgba(255, 255, 255, 0.08);
      }
      .screen {
        position: relative;
        width: 442px;
        height: 912px;
        border-radius: 50px;
        overflow: hidden;
        background: var(--deep);
      }
      .screen img {
        position: absolute;
        left: 0;
        top: 0;
        width: 442px;
        height: 912px;
        object-fit: cover;
        object-position: top;
      }
      .notch {
        position: absolute;
        left: 50%;
        top: 14px;
        width: 26px;
        height: 26px;
        margin-left: -13px;
        border-radius: 50%;
        background: #0b111d;
        z-index: 2;
      }

      .hero {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .hero img {
        width: 220px;
        height: 220px;
      }
      .hero h1 {
        margin-top: 40px;
        font-size: 120px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .hero p {
        margin-top: 18px;
        font-size: 40px;
        color: var(--muted);
        max-width: 1300px;
        line-height: 1.4;
      }
      .hero .pills {
        margin-top: 48px;
        display: flex;
        gap: 18px;
      }
      .hero .pills span {
        font-size: 28px;
        font-weight: 500;
        padding: 12px 28px;
        border-radius: 999px;
        border: 2px solid rgba(235, 176, 140, 0.5);
        color: var(--sand);
      }
    </style>
  </head>
  <body>
    <div class="stage"><div class="grid"></div></div>

    <div id="hero" class="hero">
      <img src="../../docs/assets/logo.svg" alt="" />
      <h1 id="hero-title"></h1>
      <p id="hero-body"></p>
      <div class="pills" id="hero-pills"></div>
    </div>

    <div id="main">
      <div class="brand"><img src="../../docs/assets/logo.svg" alt="" />Race jeunes</div>
      <div class="caption" id="caption">
        <span class="kicker" id="kicker"></span>
        <h2 class="title" id="title"></h2>
        <p class="body" id="body"></p>
      </div>
      <div class="chapters" id="chapters"></div>
      <div class="phone" id="phone">
        <div class="screen">
          <div class="notch"></div>
          <img id="a" alt="" /><img id="b" alt="" />
        </div>
      </div>
    </div>
    <div class="bar"></div>
    <div class="progress" id="progress"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const cache = new Map();
      async function setImg(el, src) {
        if (!src) {
          el.style.visibility = "hidden";
          return;
        }
        el.style.visibility = "visible";
        if (el.dataset.src === src) return;
        el.dataset.src = src;
        el.src = src;
        await el.decode();
      }
      // état d'une image de la vidéo, calculé par build.mjs
      window.frame = async (s) => {
        $("hero").style.display = s.hero ? "flex" : "none";
        $("main").style.display = s.hero ? "none" : "block";
        $("progress").style.width = `${(s.progress * 100).toFixed(2)}%`;
        if (s.hero) {
          $("hero-title").textContent = s.hero.title;
          $("hero-body").textContent = s.hero.body;
          $("hero-pills").innerHTML = (s.hero.pills || []).map((p) => `<span>${p}</span>`).join("");
          $("hero").style.opacity = s.alpha;
          $("hero").style.transform = `translateY(${(1 - s.alpha) * 20}px)`;
          return;
        }
        $("kicker").textContent = s.kicker;
        $("title").textContent = s.title;
        $("body").textContent = s.body;
        $("caption").style.opacity = s.alpha;
        $("caption").style.transform = `translateY(${(1 - s.alpha) * 28}px)`;
        $("chapters").innerHTML = Array.from(
          { length: s.chapterCount },
          (_, i) => `<span class="${i === s.chapter ? "on" : ""}"></span>`,
        ).join("");
        $("phone").style.opacity = s.phoneAlpha;
        $("phone").style.transform = `translateY(${(1 - s.phoneAlpha) * 40}px)`;
        await setImg($("a"), s.src);
        await setImg($("b"), s.prev);
        $("b").style.opacity = s.prev ? s.prevAlpha : 0;
      };
      window.ready = document.fonts.ready.then(() =>
        Promise.all([...document.images].filter((i) => i.src).map((i) => i.decode())),
      );
    </script>
  </body>
</html>
